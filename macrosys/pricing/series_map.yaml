# Series the pricing layer reads. Ids follow the connectors in macrosys/sources.
# A series named here and not yet written by a connector is an expected id, not a
# silent substitute. Comments are the convention notes.

variables:
  policy: [policy_rate, policy, funds_rate]
  inflation: [inflation, cpi, breakeven]
  price: [price, futures_price]
  growth: [growth, earnings_growth, implied_growth]
  spread: [spread]

# USD nominal curve. GSW zeros are preferred when any SVENY print is in the snapshot.
# Treasury par tenors match macrosys.sources.treasury (TREASURY:PAR:1M … 30Y).
nominal_zero:
  USD:
    gsw_pattern: "FEDGSW:SVENY{nn:02d}"
    gsw_compounding: continuous
    gsw_note: >
      FEDGSW:SVENY01..SVENY30 are the GSW continuously compounded zero-coupon
      yields in percent (the feds200628 header says Continuously Compounded).
      Tenor of SVENYnn is nn years.
    par_pattern: "TREASURY:PAR:{tenor}"
    par_tenors: [1M, 2M, 3M, 4M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y]
  EUR:
    # [M] ECB SDW yield curve, Svensson, euro area AAA government, spot rate.
    # The generic ECB connector stores ECB:<KEY>. Compounding is annual [J]:
    # the published spot is "percent per annum"; confirm before a breakeven.
    spot_pattern: "ECB:YC.B.U2.EUR.4F.G_N_A.SV_C_YM.SR_{label}"
    spot_labels: [3M, 6M, 1Y, 2Y, 3Y, 4Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]
    compounding: annual

policy:
  USD:
    ccy: USD
    entity_ids: [USD, USA, FED]
    futures_prefix: "CME:FF:"
    convention: fedfunds
    price_unit: index
    spot: NYFED:EFFR:percentRate
    note: >
      CME:FF:YYYY-MM is the fed-funds futures settlement in index points
      (rate = 100 − price). Not written by a connector yet. NYFED:EFFR:percentRate
      is the effective-funds print from macrosys.sources.nyfed (type EFFR,
      field percentRate). The path uses settlements, not the spot print.
  EUR:
    ccy: EUR
    entity_ids: [EUR, EA, ECB]
    futures_prefix: null
    convention: null
    spot: ECB:EST.B.EU000A2X2A25.WT
    gap: >
      OIS and €STR futures are not in the connectors (spec §9.8).
      ECB:EST.B.EU000A2X2A25.WT is the €STR level, not a path.

breakeven:
  USD:
    ccy: USD
    entity_ids: [USD, USA]
    # Published par breakevens (nominal CMT minus real CMT), percent.
    # Real CMT DFII5/7/10/20/30 start at 5Y and the Treasury connector does not
    # parse the real par XML, so a real zero bootstrap is not available.
    series:
      "5": FRED:T5YIE
      "10": FRED:T10YIE
    real_par_note: >
      FRED:DFII5, DFII7, DFII10, DFII20, DFII30 are real par yields. They are
      not bootstrapped here.
  EUR:
    ccy: EUR
    entity_ids: [EUR, EA]
    series: {}
    gap: >
      Euro inflation swaps and the inflation-linked yield curve are not mapped
      (spec §9.8). No breakeven series is read for EUR.

term_premium:
  # NY Fed ACM spreadsheet column ACMTPnn. macrosys.sources.nyfed loads SOFR,
  # EFFR, RRP, and primary dealers only — it does not load ACM. This is the
  # series id a later loader should write, in percent.
  ACM:
    pattern: "NYFED:ACM:TP{tenor}"
    note: "NYFED:ACM:TP10 is the 10-year ACM term premium. Tenor is the integer year, not zero-padded."
  KW:
    series:
      "10": FRED:THREEFYTP10
    note: "Kim–Wright 10-year term premium on FRED. No other tenor is in this map."

commodities:
  brent:
    entity_ids: [brent, Brent, BZ, CO]
    futures_prefix: "ICE:B:"
    spot: FRED:DCOILBRENTEU
    price_unit: USD
    note: >
      FRED:DCOILBRENTEU is Europe Brent spot, USD per barrel, via the FRED
      connector. ICE:B:YYYY-MM is the Brent futures settlement. Futures are
      not written by a connector yet. The spot print is not a curve.
  copper:
    entity_ids: [copper, Cu, HG]
    futures_prefix: "CME:HG:"
    spot: FRED:PCOPPUSDM
    price_unit: USD
    note: >
      FRED:PCOPPUSDM is the IMF/FRED global copper price, USD per metric ton.
      CME:HG:YYYY-MM is the COMEX copper futures settlement, not in a connector.

# Credit spread as the market quantity (C06). The point change is zero [J]:
# the OAS level is what is priced, with no mean-reversion forecast. The range
# is the percentile band of overlapping changes over the thesis window.
# low_percentile, high_percentile, min_changes, and match_tolerance_days are
# declared method choices, not fitted premia.
credit_spread:
  USA:
    entity_ids: [USA]
    series: FRED:BAMLH0A0HYM2
    level_unit: pct
    low_percentile: 10
    high_percentile: 90
    min_changes: 20
    match_tolerance_days: 7
    note: >
      ICE BofA US High Yield Index option-adjusted spread, percent. The route
      expression is HYG. FRED:BAMLC0A0CM is the investment-grade OAS and is not
      this mapping. One percent of OAS is 100 bp.

instruments:
  CPER:
    earnings_yield: PRICING:CPER:EARNINGS_YIELD
    payout: PRICING:CPER:PAYOUT
    note: >
      Earnings yield in pct and payout in share. Neither is produced by Tiingo
      or the other connectors (spec §9.8). The resolver reads them if a loader
      has written them.
  SPY:
    earnings_yield: PRICING:SPY:EARNINGS_YIELD
    payout: PRICING:SPY:PAYOUT
    trailing_dividend:
      price_id: TIINGO:SPY
      action_id: TIINGO:SPY
      lookback_days: 365
      min_payments: 4
      close_max_age_days: 10
      ccy: USD
    note: >
      Preferred input is a forward earnings yield in pct, or a PE ratio, at
      PRICING:SPY:EARNINGS_YIELD. No connector writes it. FRED:SP500 is the
      index level and is not an earnings yield; corporate profits divided by
      the index need the divisor (TODO_estimate) and are not used. Until the
      earnings yield is stored, the Gordon input is the trailing cash-dividend
      yield of TIINGO:SPY.

# Pairs with no market quantity. The text is the part after "missing:" in
# NoPricedInError. A translation that needs a coefficient stays here while
# that coefficient is TODO_estimate.
named_gaps:
  - entity_type: economy
    entity_id: USA
    variable: credit
    missing: >
      no market price of US bank credit growth in pct (B12). The nearest market
      read is the ICE BofA option-adjusted spread (C06): FRED:BAMLH0A0HYM2
      (US high yield, percent; the HYG expression) and FRED:BAMLC0A0CM
      (US investment grade, percent). Translating an OAS change in bp into a
      bank-credit-growth change in pct needs a sourced coefficient; none is
      stored (TODO_estimate). Gilchrist and Zakrajsek 2012 links the excess
      bond premium to activity, not an OAS-to-loan-growth elasticity. B12's
      elasticity maps SLOOS net tightening in pp (FRED:DRTSCILM) to H.8 loan
      growth (FRED:BUSLOANS), which is not this translation. Closes when an
      OAS-to-credit coefficient is estimated and stored, or when a point-in-time
      consensus path for US bank credit growth is mapped. FRED:BUSLOANS is the
      realized stock, not a market-implied change.
  - entity_type: economy
    entity_id: USA
    variable: borrowing
    missing: >
      no market price of US borrowing capacity in pct (B13). The nearest market
      quantity is the collateral price (TIINGO:SPY record closes, or FRED:SP500).
      Translating a price percent into a borrowing-capacity percent needs B13's
      elasticity (source TODO_estimate) and a leverage share.
      config/local_estimates.yaml sketches that elasticity on FRED:BCNSDODNS,
      FRED:SPASTT01USM661N, and FRED:NCBCMDPMVCE, and the card does not install
      it, so those series are not multiplied here. Closes when that elasticity
      is estimated and stored and a point-in-time leverage series is mapped.
  - entity_type: instrument
    entity_id: EMB
    variable: credit
    missing: >
      no USD emerging-market sovereign spread is stored for EMB. EMB tracks the
      J.P. Morgan EMBI Global Core, and the market quantity is that index's
      stripped spread in basis points (C06), not cross-border credit growth in
      percent (B18). The pipeline's ICE BofA OAS series are FRED:BAMLH0A0HYM2
      and FRED:BAMLC0A0CM only. FRED:BAMLEMCBPIOAS is the ICE BofA Emerging
      Markets Corporate Plus OAS and excludes sovereign and supranational debt,
      so it is not a substitute and it is not in the store. No FRED series id
      for an ICE BofA USD EM sovereign OAS was confirmed, and the JPM EMBI
      stripped spread is not a free FRED series (spec §9.8). Closes when a USD
      EM sovereign OAS is loaded. A spread change in bp is not B18's credit
      percent without a coefficient (TODO_estimate).

# Spec §7.3: an industry with no direct implied quantity uses the nearest
# instrument's implied growth, with a wider range and lower confidence.
# USA:C26 matches the entity-id shape in spec §4.7. The link to CPER is a
# declared example, not a checked ICIO-to-ETF crosswalk.
nearest_instrument:
  USA:C26:
    instrument_id: CPER
    note: "Declared nearest listed expression for the industry fallback example."
