# widths [J], not literature estimates and not zeros.

c09_risk_premium_pct:
  unit: pct
  value: null
  low: -0.10
  high: 0.10
  provenance: TODO_estimate
  note: >
    Symmetric band around a fed-funds or SOFR futures rate. One-tenth of a percent
