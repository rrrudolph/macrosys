method: OLS of the market change on the standardized statistical surprise with an
  intercept; HC1 standard errors; 95% interval is beta +- 1.96 se. Sign tests count
  events with |surprise| >= threshold sd. Out-of-sample accuracy uses the slope sign
  fitted on purged walk-forward training folds (spec 10.1 item 11, 10.2 item 1).
caveat: Surprises are against a statistical forecast from earlier prints, not a survey
  consensus (spec 9.8, P2.4). Coefficients are market responses per 1 sd surprise,
  not structural elasticities; they feed pricing-gap timing and B23, not the IO propagation.
