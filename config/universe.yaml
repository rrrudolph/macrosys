  # https://www.ssga.com/us/en/intermediary/etfs/spdr-gold-shares-gld
  - ticker: GLD
    structure: physical
    role: factor_gold
    expense_ratio: 0.0040
    exposure: {asset_class: commodity, commodity: gold}
  # SLV 0.50% sponsor fee on the iShares list. Silver bullion.
  # https://www.ishares.com/us/products/etf-investments
  - ticker: SLV
    structure: physical
    expense_ratio: 0.0050
    exposure: {asset_class: commodity, commodity: silver}
  # Invesco DB funds, total / net: DBC 0.89 / 0.84, DBA 0.93 / 0.88, DBB 0.79 / 0.75.
  # Baskets, so no single commodity. https://www.invesco.com/us/en/solutions/invesco-etfs/commodity-investing.html
  - ticker: DBC
    structure: futures
    expense_ratio: 0.0084
    exposure: {asset_class: commodity}
  # USO: light sweet crude (WTI) futures. The uscfinvestments.com fee cell is blank.
  # Prospectus dated 2026-04-24: total annual fund operating expenses 0.86%
  # (management 0.45% + other 0.41% for the year ended 2025). Read 2026-10-15.
  # https://www.uscfinvestments.com/uso
  # https://www.sec.gov/Archives/edgar/data/1327068/000207187626000128/i26211_uso-424b3.htm
  - ticker: USO
    structure: futures
    role: factor_energy
    underlying: WTI
    expense_ratio: 0.0086
    exposure: {asset_class: commodity, commodity: WTI}
  # UNG: natural gas futures (Henry Hub benchmark contract). The site fee cell is blank;
  # the footnote is only the tiered management fee. Prospectus dated 2026-04-24 states
  # total annual fund operating expenses of 1.17% (management 0.60% on assets up to $1bn,
  # other 0.57% for 2025). Above $1bn the management fee on the increment is 0.50% and the
  # total would be lower. 2025 average assets were about $520m, so 1.17% is the stated total.
  # Read 2026-10-15.
  # https://www.uscfinvestments.com/ung
  # https://www.sec.gov/Archives/edgar/data/1376227/000207187626000124/i26207_ung-424b3.htm
  - ticker: UNG
    structure: futures
    underlying: natural gas
    expense_ratio: 0.0117
    exposure: {asset_class: commodity, commodity: natural gas}
