# Illustrative ETF universe (spec §11.1). Tickers are configuration, not design; the owner edits this file.
# `structure`: physical | futures | synthetic | hedged. Leveraged/inverse/VIX-linked products are excluded by mandate.
#
# `exposure` and `expense_ratio` below are issuer facts [M], read 2026-10-15. A label means the fund's
# stated objective (weight 1 of that bucket), not a holdings estimate. A field the page did not support
# is omitted, and the expression check then fails. The store's holding_snapshot table is empty, so this
# file is the exposure path until N-PORT rows exist. Expense ratios are annual NAV shares (0.0049 = 0.49%).
# Where the issuer publishes a gross and a net figure, the net is stored and the gross is in the comment.
instruments:
  # Global / regional equity
  # ACWI 0.32% gross = net. Global large/mid equities; no single country.
  # https://www.ishares.com/us/products/239600/ishares-msci-acwi-etf
  # https://www.ishares.com/us/products/etf-investments
  - ticker: ACWI
    structure: physical
    role: factor_global_equity
    expense_ratio: 0.0032
    exposure: {asset_class: equity}
  # SPY gross = net 0.0945%. Benchmark S&P 500 Index (US equities).
  # https://www.ssga.com/us/en/intermediary/etfs/state-street-spdr-sp-500-etf-trust-spy
  - ticker: SPY
    structure: physical
    expense_ratio: 0.000945
    exposure: {asset_class: equity, country: USA, currency: USD}
  # IWM 0.19% gross = net. Russell 2000 US small-cap, from the iShares product name on the fund list.
  # https://www.ishares.com/us/products/etf-investments
  - ticker: IWM
    structure: physical
    expense_ratio: 0.0019
    exposure: {asset_class: equity, country: USA, currency: USD}
  # EFA 0.32%. Developed equities outside the US and Canada; no single country.
  # https://www.ishares.com/us/products/239623/ishares-msci-eafe-etf
  - ticker: EFA
    structure: physical
    expense_ratio: 0.0032
    exposure: {asset_class: equity}
  # HEFA gross 0.70%, net 0.35% after the prospectus waiver. MSCI EAFE 100% hedged to USD.
  # No single country. Currency left is the dollar.
  # https://www.ishares.com/us/products/259622/ishares-currency-hedged-msci-eafe-etf
  - ticker: HEFA
    structure: hedged
    hedged_pair_of: EFA
    expense_ratio: 0.0035
    exposure: {asset_class: equity, currency: USD}
  # EEM 0.72%. Emerging-market equities; no single country on the fund list.
  # https://www.ishares.com/us/products/etf-investments
  - ticker: EEM
    structure: physical
    role: factor_em_equity
    expense_ratio: 0.0072
    exposure: {asset_class: equity}
  # EWJ 0.49%. "seeks to track an index composed of Japanese equities." Unhedged, so the yen remains.
  # https://www.ishares.com/us/products/239665/ishares-msci-japan-etf
  - ticker: EWJ
    structure: physical
    expense_ratio: 0.0049
    exposure: {asset_class: equity, country: JPN, currency: JPY}
  # DXJ expense ratio 0.48% as of 2026-10-14. Japanese equities, hedged USD/JPY.
  # The page says the cost to hedge is in the NAV and is not a separate fee.
  # https://www.wisdomtree.com/us/products/equity/dxj
  - ticker: DXJ
    structure: hedged
    hedged_pair_of: EWJ
    expense_ratio: 0.0048
    exposure: {asset_class: equity, country: JPN, currency: USD}
  # Single-country iShares MSCI funds. Expense ratios are gross = net on the fund list.
  # Currency is the unhedged local listing currency; the hedged class is a different ticker.
  # https://www.ishares.com/us/products/etf-investments
  - ticker: EWG
    structure: physical
    expense_ratio: 0.0049
    exposure: {asset_class: equity, country: DEU, currency: EUR}
  - ticker: EWU
    structure: physical
    expense_ratio: 0.0050
    exposure: {asset_class: equity, country: GBR, currency: GBP}
  # MSCI China holds mainland, Hong Kong, and US listings, so currency is left unset.
  - ticker: MCHI
    structure: physical
    expense_ratio: 0.0059
    exposure: {asset_class: equity, country: CHN}
  - ticker: EWY
    structure: physical
    expense_ratio: 0.0059
    exposure: {asset_class: equity, country: KOR, currency: KRW}
  - ticker: EWT
    structure: physical
    expense_ratio: 0.0059
    exposure: {asset_class: equity, country: TWN, currency: TWD}
  - ticker: INDA
    structure: physical
    expense_ratio: 0.0061
    exposure: {asset_class: equity, country: IND, currency: INR}
  - ticker: EWZ
    structure: physical
    expense_ratio: 0.0059
    exposure: {asset_class: equity, country: BRA, currency: BRL}
  - ticker: EWW
    structure: physical
    expense_ratio: 0.0050
    exposure: {asset_class: equity, country: MEX, currency: MXN}
  - ticker: EWC
    structure: physical
    expense_ratio: 0.0050
    exposure: {asset_class: equity, country: CAN, currency: CAD}
  - ticker: EWA
    structure: physical
    expense_ratio: 0.0050
    exposure: {asset_class: equity, country: AUS, currency: AUD}
