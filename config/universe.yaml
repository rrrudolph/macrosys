  # https://www.uscfinvestments.com/cper
  # https://www.sec.gov/Archives/edgar/data/1479247/000207187626000122/i26205_cper-424b3.htm
  - ticker: CPER
    structure: futures
    underlying: copper
    expense_ratio: 0.0088
    exposure: {asset_class: commodity, commodity: copper}
  - ticker: DBB
