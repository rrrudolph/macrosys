  # UUP: long DX futures tracking the Deutsche Bank Long USD Currency Portfolio Index
  # (long the dollar against the USDX basket). Filing states aggregate fees of about 0.78%
  # a year; the same report shows expenses prior to waivers of 0.78% and after waivers of
  # 0.76%, 0.68%, and 0.75% across the three periods, so 0.78% is the gross figure.
  # Read 2026-10-15.
  # https://www.invesco.com/us-rest/contentdetail?contentId=3d46d72b-1df3-4f04-b1fc-b57c7e70abf3&dnsName=us
  - ticker: UUP
    structure: futures
    role: factor_usd
    expense_ratio: 0.0078
    exposure: {currency: USD}
