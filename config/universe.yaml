    exposure: {asset_class: fixed_income, currency: USD}
  # EMB 0.39%. J.P. Morgan USD emerging-markets bond; dollar bonds, no single country.
  - ticker: EMB
    structure: physical
    expense_ratio: 0.0039
    exposure: {asset_class: fixed_income, currency: USD}
  # EMLC gross 0.31%, net 0.30% with a waiver through at least 2027-05-01.
  # Local-currency EM bonds; no single country or currency.
  # https://www.vaneck.com/us/en/investments/jp-morgan-em-local-currency-bond-etf-emlc/
  - ticker: EMLC
    structure: physical
