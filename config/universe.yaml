  # Rates. iShares Treasury names state the maturity band and the US Treasury issuer.
  # Fees are gross = net on https://www.ishares.com/us/products/etf-investments
  # BIL gross expense ratio 0.1353%. Publicly issued U.S. Treasury bills with 1–3 months left.
  # Benchmark: Bloomberg 1-3 Month U.S. Treasury Bill Index. Base currency USD. Read 2026-10-15.
  # https://www.ssga.com/us/en/individual/etfs/state-street-spdr-bloomberg-1-3-month-t-bill-etf-bil
  - ticker: BIL
    structure: physical
    expense_ratio: 0.001353
    exposure: {asset_class: fixed_income, country: USA, currency: USD, duration_bucket: "1_3m"}
  - ticker: SHY
    structure: physical
    expense_ratio: 0.0015
    exposure: {asset_class: fixed_income, country: USA, currency: USD, duration_bucket: "1_3y"}
  - ticker: IEI
    structure: physical
    expense_ratio: 0.0015
    exposure: {asset_class: fixed_income, country: USA, currency: USD, duration_bucket: "3_7y"}
