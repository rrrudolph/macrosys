# Live pipeline (spec §9.4). Coverage ids are the series the parsers write.
# A fetch id such as CBOE:VIX or BEA:NIPA:T10105 downloads a file and stores one row per column or line.
# Price history is long enough for a later walk-forward. Secrets stay in the environment.
db_path: data/store/macrosys.duckdb
raw_root: raw
manifest_dir: data/manifests
library_version: "0.0.1"
parameter_set: default
code_commit: local
price_lookback_days: 8000
cross_check_tol: 0.01
cross_check_instruments: []
series:
